name: Deploy Next.js site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

env:
  NEXT_PUBLIC_BASE_PATH: /wikiclubtech-nitin
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: WikiClub-Tech-UU-main/WikiClub-Tech-UU-main

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: WikiClub-Tech-UU-main/WikiClub-Tech-UU-main/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Verify static export
        run: |
          test -f out/index.html
          test -f out/teams/index.html
          echo "Static export verified: homepage and Teams page are present."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: WikiClub-Tech-UU-main/WikiClub-Tech-UU-main/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
