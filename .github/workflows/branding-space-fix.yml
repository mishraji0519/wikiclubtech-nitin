name: Normalize Wikiclub Tech branding

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  normalize-branding:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add space between Wikiclub and Tech in visible Teams branding
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('WikiClub-Tech-UU-main/WikiClub-Tech-UU-main/src/app/teams/page.tsx')
          text = path.read_text(encoding='utf-8')
          updated = text.replace('Wikiclubtech-UU', 'Wikiclub Tech-UU')
          if updated != text:
              path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit branding change
        run: |
          if git diff --quiet; then
            echo 'No branding changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add WikiClub-Tech-UU-main/WikiClub-Tech-UU-main/src/app/teams/page.tsx
          git commit -m 'fix: add space in Wikiclub Tech branding'
          git push
